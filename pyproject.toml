[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vancodose"
version = "2.0.0"
requires-python = ">=3.10"
description = "Vancomycin exposure prediction and precision dosing (synthetic cohort)"

[tool.setuptools]
packages = ["vanco"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
